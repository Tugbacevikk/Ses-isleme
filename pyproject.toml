[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-analyzer"
version = "0.1.0"
description = "High-performance Audio Analysis (STT + Speaker Diarization) System"
authors = [
    { name = "Engineers", email = "engineer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.1",
    "speechbrain>=0.5.16",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "rq>=1.15.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "torch>=2.1.0",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[project.scripts]
audio-analyzer-api = "audio_analyzer.api.main:start"
audio-analyzer-cli = "run_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "system: End-to-end system tests",
    "benchmark: Performance benchmark tests",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]

